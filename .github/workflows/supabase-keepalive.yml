# Free-plan Supabase projects pause after about a week without activity, which breaks sign-in
# and sync until someone restores the project. This makes a tiny read twice a week to keep it
# awake. It uses the public anon key the app already ships in js/db.js (row-level security
# returns no rows to it), so no secrets are needed.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 9 * * 1,4' # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: js/db.js
          sparse-checkout-cone-mode: false

      - name: Ping Supabase
        run: |
          URL=$(grep -oE "SUPABASE_URL = '[^']+'" js/db.js | cut -d"'" -f2)
          KEY=$(grep -oE "SUPABASE_ANON_KEY = atob\('[^']+'\)" js/db.js | sed -E "s/.*atob\('([^']+)'\).*/\1/" | base64 -d)
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/rest/v1/trips?select=id&limit=1")
          echo "Supabase responded $STATUS"
          [ "$STATUS" = "200" ]
